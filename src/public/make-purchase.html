<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Make Purchase - Inventory Aggregator</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f7fafc;
        padding: 40px;
      }
      .card {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #2d3748;
        margin-bottom: 20px;
        text-align: center;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #4a5568;
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #ed8936;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
      }
      button:hover {
        background: #dd6b20;
      }
      .alert {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        display: none;
      }
      .success {
        background: #c6f6d5;
        color: #22543d;
        border-left: 5px solid #38a169;
      }
      .error {
        background: #fed7d7;
        color: #822727;
        border-left: 5px solid #e53e3e;
      }
      .nav {
        margin-top: 20px;
        text-align: center;
      }
      .nav a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>🛒 Place an Order</h2>
      <form id="purchaseForm">
        <div class="form-group">
          <label>Select Product</label>
          <select id="productId" required>
            <option value="">Loading items...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" id="quantity" min="1" value="1" required />
        </div>
        <div class="form-group">
          <label>User Identifier (Optional)</label>
          <input type="text" id="userId" placeholder="anonymous" />
        </div>
        <button type="submit">Confirm Purchase</button>
      </form>
      <div id="response" class="alert"></div>
      <div class="nav">
        <a href="/dashboard">← Back to Dashboard</a> |
        <a href="/purchase-history">View History</a>
      </div>
    </div>

    <script>
      async function loadProducts() {
        const res = await fetch("/api/products");
        const products = await res.json();
        const select = document.getElementById("productId");
        select.innerHTML =
          '<option value="">-- Choose Item --</option>' +
          products
            .map(
              (p) =>
                `<option value="${p._id}">${p.name} ($${p.currentPrice})</option>`,
            )
            .join("");
      }

      document.getElementById("purchaseForm").onsubmit = async (e) => {
        e.preventDefault();
        const alert = document.getElementById("response");
        const payload = {
          productId: document.getElementById("productId").value,
          quantity: parseInt(document.getElementById("quantity").value),
          userId: document.getElementById("userId").value || "anonymous",
        };

        try {
          const res = await fetch("/api/purchase", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          alert.style.display = "block";
          if (res.ok) {
            alert.className = "alert success";
            alert.innerHTML = `<strong>Success!</strong> Transaction ID: ${data.data.transactionId}<br>Remaining Stock: ${data.data.remainingStock}`;
            if (data.alerts?.isLowStock) {
              alert.innerHTML += `<br><span style="color:red">${data.alerts.message}</span>`;
            }
          } else {
            throw new Error(data.error || "Purchase failed");
          }
        } catch (err) {
          alert.className = "alert error";
          alert.textContent = err.message;
        }
      };
      loadProducts();
    </script>
  </body>
</html>
