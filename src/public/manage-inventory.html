<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Stock - Aggregator</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f4f7f6;
        padding: 40px;
      }
      .card {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      select,
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      .msg {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Update Product Stock</h2>
      <form id="stockForm">
        <div class="form-group">
          <label>Select Product</label>
          <select id="productId" required>
            <option value="">Loading products...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Stock Quantity</label>
          <input type="number" id="stock" min="0" required />
        </div>
        <div class="form-group">
          <label>Low Stock Threshold</label>
          <input type="number" id="threshold" min="0" value="10" required />
        </div>
        <button type="submit">Update Inventory</button>
      </form>
      <div id="message" class="msg"></div>
      <p>
        <a href="/inventory-list" style="color: #667eea">View All Inventory</a>
      </p>
    </div>

    <script>
      async function loadProducts() {
        const res = await fetch("/api/products");
        const products = await res.json();
        const select = document.getElementById("productId");
        select.innerHTML =
          '<option value="">-- Choose a Product --</option>' +
          products
            .map(
              (p) => `<option value="${p._id}">${p.name} (${p.sku})</option>`,
            )
            .join("");
      }

      document.getElementById("stockForm").onsubmit = async (e) => {
        e.preventDefault();
        const msg = document.getElementById("message");
        const payload = {
          productId: document.getElementById("productId").value,
          stock: parseInt(document.getElementById("stock").value),
          lowStockThreshold: parseInt(
            document.getElementById("threshold").value,
          ),
        };

        try {
          const res = await fetch("/api/inventory", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          msg.style.display = "block";
          if (res.ok) {
            msg.textContent = "Inventory updated successfully!";
            msg.style.background = "#d4edda";
            document.getElementById("stockForm").reset();
          } else {
            throw new Error(data.error || "Update failed");
          }
        } catch (err) {
          msg.textContent = err.message;
          msg.style.background = "#f8d7da";
        }
      };
      loadProducts();
    </script>
  </body>
</html>
