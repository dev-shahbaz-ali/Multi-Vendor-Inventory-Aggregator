<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Products - Inventory Aggregator</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        color: #333;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 2px solid #f0f0f0;
        padding-bottom: 15px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      .nav-links a {
        text-decoration: none;
        color: #667eea;
        font-weight: bold;
        margin-left: 15px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid #eee;
      }
      th {
        background-color: #f8f9fa;
        color: #666;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 1px;
      }
      tr:hover {
        background-color: #fcfcfc;
      }
      .price {
        font-weight: bold;
        color: #2ecc71;
      }
      .sku {
        font-family: monospace;
        background: #eee;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .no-products {
        text-align: center;
        padding: 40px;
        color: #999;
      }
      .loading {
        text-align: center;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📦 Product Inventory</h1>
        <div class="nav-links">
          <a href="/dashboard">← Dashboard</a>
          <a href="/add-product">+ Add New</a>
        </div>
      </div>

      <div id="loading" class="loading">Loading products...</div>

      <table id="productsTable" style="display: none">
        <thead>
          <tr>
            <th>Product Name</th>
            <th>SKU</th>
            <th>Current Price</th>
            <th>Description</th>
            <th>Date Added</th>
          </tr>
        </thead>
        <tbody id="productsList"></tbody>
      </table>

      <div id="noProducts" class="no-products" style="display: none">
        No products found. <a href="/add-product">Add your first product!</a>
      </div>
    </div>

    <script>
      async function fetchProducts() {
        const loadingEl = document.getElementById("loading");
        const tableEl = document.getElementById("productsTable");
        const listEl = document.getElementById("productsList");
        const noProductsEl = document.getElementById("noProducts");

        try {
          const response = await fetch("/api/products");

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(
              errorData.message || `Server error: ${response.status}`,
            );
          }

          const products = await response.json();
          console.log("Fetched products:", products); // Debugging log

          loadingEl.style.display = "none";

          if (!Array.isArray(products) || products.length === 0) {
            noProductsEl.style.display = "block";
            tableEl.style.display = "none";
            return;
          }

          noProductsEl.style.display = "none";
          tableEl.style.display = "table";
          listEl.innerHTML = products
            .map(
              (p) => `
            <tr>
              <td><strong>${p.name || "Unnamed Product"}</strong></td>
              <td><span class="sku">${p.sku || "N/A"}</span></td>
              <td class="price">$${(p.currentPrice !== undefined
                ? p.currentPrice
                : p.price !== undefined
                  ? p.price
                  : 0
              ).toFixed(2)}</td>
              <td>${p.description || "-"}</td>
              <td>${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : "N/A"}</td>
            </tr>
          `,
            )
            .join("");
        } catch (err) {
          console.error("Fetch error:", err);
          loadingEl.innerHTML = `<span style="color: #e74c3c; font-weight: bold;">❌ Error: ${err.message}</span>`;
        }
      }
      fetchProducts();
    </script>
  </body>
</html>
