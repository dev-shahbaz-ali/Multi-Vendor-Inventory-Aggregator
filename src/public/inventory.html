<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Inventory - Aggregator</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f0f2f5;
        padding: 20px;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }
      th {
        background: #fafafa;
        color: #666;
        font-size: 12px;
        text-transform: uppercase;
      }
      .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
      }
      .status-low {
        background: #fff3e0;
        color: #ef6c00;
      }
      .status-ok {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .status-out {
        background: #ffebee;
        color: #c62828;
      }
      .nav-links a {
        text-decoration: none;
        color: #667eea;
        font-weight: bold;
        margin-left: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📦 Inventory Stock Levels</h1>
        <div class="nav-links">
          <a href="/dashboard">← Dashboard</a>
          <a href="/manage-inventory">Manage Stock</a>
        </div>
      </div>
      <table id="inventoryTable">
        <thead>
          <tr>
            <th>Product</th>
            <th>SKU</th>
            <th>Current Stock</th>
            <th>Threshold</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="inventoryList"></tbody>
      </table>
    </div>

    <script>
      async function loadInventory() {
        try {
          const response = await fetch("/api/inventory");
          const result = await response.json();
          const list = document.getElementById("inventoryList");

          if (result.success && result.data.length > 0) {
            list.innerHTML = result.data
              .map((item) => {
                const isOut = item.stock === 0;
                const isLow = item.stock <= item.lowStockThreshold;
                const statusLabel = isOut
                  ? "OUT OF STOCK"
                  : isLow
                    ? "LOW STOCK"
                    : "OK";
                const statusClass = isOut
                  ? "status-out"
                  : isLow
                    ? "status-low"
                    : "status-ok";

                return `
                <tr>
                  <td>${item.productId?.name || "Unknown"}</td>
                  <td><code>${item.productId?.sku || "N/A"}</code></td>
                  <td><strong>${item.stock}</strong></td>
                  <td>${item.lowStockThreshold}</td>
                  <td><span class="badge ${statusClass}">${statusLabel}</span></td>
                </tr>
              `;
              })
              .join("");
          } else {
            list.innerHTML =
              '<tr><td colspan="5" style="text-align:center">No inventory records found.</td></tr>';
          }
        } catch (err) {
          console.error(err);
        }
      }
      loadInventory();
    </script>
  </body>
</html>
